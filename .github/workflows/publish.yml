# Publishes to PyPI when a version tag (v1.2.3) is pushed, using PyPI "trusted
# publishing" (no API token stored anywhere). One-time setup on pypi.org:
#   Your projects -> Publishing -> add a "pending publisher":
#     PyPI project name: impactgraph
#     Owner: sumit-gupta03   Repository: impactgraph
#     Workflow name: publish.yml   Environment name: pypi
# Then set the repository variable PYPI_TRUSTED_PUBLISHER=true and
#   git tag v0.7.3 && git push origin v0.7.3
name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install "datagraph-core[sql,yaml] @ git+https://github.com/sumit-gupta03/datagraph@main" \
            || python -m pip install "datagraph[sql,yaml] @ git+https://github.com/sumit-gupta03/impactgraph@v0.5.0"
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    if: vars.PYPI_TRUSTED_PUBLISHER == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
