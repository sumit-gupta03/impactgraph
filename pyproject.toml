[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "impactgraph"
version = "0.7.5"
description = "Pre-merge safety net: what breaks if I merge this? Blast radius, risk, owners and a test plan on every PR - built on datagraph."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sumit Kumar Gupta" }, { name = "Nitish Pradhan" }]
keywords = ["impact-analysis", "blast-radius", "pull-request", "ci", "dependency-graph", "dbt", "lineage", "change-management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "datagraph-core>=0.8.4",
]

[project.optional-dependencies]
sql = ["datagraph-core[sql]"]
yaml = ["datagraph-core[yaml]"]
ai = ["datagraph-core[ai]"]
all = ["datagraph-core[all]"]
dev = ["datagraph-core[sql,yaml]", "pytest>=7"]

[project.scripts]
impactgraph = "impactgraph.cli:main"

[project.urls]
Homepage = "https://github.com/sumit-gupta03/impactgraph"
Engine = "https://github.com/sumit-gupta03/datagraph"
Issues = "https://github.com/sumit-gupta03/impactgraph/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
